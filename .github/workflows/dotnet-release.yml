# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET-Release

on:
  push:
    tags:
      - v*

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0
    - name: check folder
      run: ls -ahl
    - name: Restore dependencies
      run: cd Birthday-Bot-Sourcecode && dotnet restore
    - name: Build
      run: cd Birthday-Bot-Sourcecode && dotnet build --configuration Release -p:DebugType=None -p:DebugSymbols=false
    - uses: actions/upload-artifact@v4
      with:
        path: Birthday-Bot-Sourcecode/Birthday-Bot-Sourcecode/bin/Release/net8.0/*
    - uses: vimtor/action-zip@v1.2
      with:
        files: Birthday-Bot-Sourcecode/Birthday-Bot-Sourcecode/bin/Release/net8.0/
        dest: release.zip
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DH_USER }}
        password: ${{ secrets.DH_PASSWORD }}
    - name: Build and push Docker image
      id: push
      uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: targetingsnake/birthday-bot:latest,targetingsnake/birthday-bot:${{ github.ref_name }}
    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.ref_type == 'tag'
      with:
        token: ${{ secrets.RELEASETOKEN }}
        name: ${{ github.ref_name }}
        files: release.zip